<title>دعوت‌نامه</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; }
  body {
    background:#f4f4f1;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-family: sans-serif;
  }
  .stage {
    width:min(92vw, 430px);
    perspective:1600px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .card {
    width:100%;
    transform-origin:center center;
    transition:transform 900ms cubic-bezier(.2,.75,.2,1), opacity 500ms ease;
    box-shadow:0 18px 50px rgba(0,0,0,.18);
    border-radius:2px;
    overflow:hidden;
    background:white;
  }
  .card.opened {
    transform:rotateY(180deg) scale(.96);
    opacity:.0;
  }
  img {
    display:block;
    width:100%;
    height:auto;
  }
  .hint {
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    color:#555;
    background:rgba(255,255,255,.88);
    padding:9px 16px;
    border-radius:999px;
    font-size:13px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    white-space:nowrap;
    transition:opacity .4s;
  }
  .hint.hide { opacity:0; }
</style>
